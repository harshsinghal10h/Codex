# Optional local development services. This is not a production deployment.
name: nexwrite-dev
services:
  postgres:
    image: postgres:16.10-bookworm
    profiles: [backend]
    environment:
      POSTGRES_USER: nexwrite
      POSTGRES_DB: nexwrite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run just dev-env first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nexwrite -d nexwrite"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.6-bookworm
    profiles: [backend]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run just dev-env first}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [backend]
    environment:
      MINIO_ROOT_USER: nexwrite-local
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run just dev-env first}
    command: server /data --console-address :9001
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
  nats:
    image: nats:2.11.8-alpine
    profiles: [backend]
    command: [-js, -sd, /data]
    ports: ["127.0.0.1:4222:4222"]
    volumes: [nats-data:/data]
  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: [backend]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: [observability]
    command: [--config=/etc/otelcol/config.yaml]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: nexwrite-local
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run just dev-env first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes: [grafana-data:/var/lib/grafana]
volumes:
  postgres-data:
  redis-data:
  minio-data:
  nats-data:
  grafana-data:
