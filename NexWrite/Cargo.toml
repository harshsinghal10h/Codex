[workspace]
members = ["core/text", "core/schema", "core/rules", "core/engine", "core/cli", "core/wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
unicode-segmentation = "1"
wasm-bindgen = "=0.2.129"
nw-schema = { path = "core/schema", version = "=0.1.0" }
nw-text = { path = "core/text", version = "=0.1.0" }
nw-rules = { path = "core/rules", version = "=0.1.0" }
nw-engine = { path = "core/engine", version = "=0.1.0" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
