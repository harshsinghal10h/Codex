<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: https: http:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>VLC Glass</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="anatomy.css"><link rel="stylesheet" href="intelligence.css"><link rel="stylesheet" href="performance.css"></head>
<body data-glass="apple"><div id="appShell"><aside id="sidebar"><div class="brand"><span class="brand-mark" data-icon="play"></span><span>VLC <b>Glass</b></span></div><nav id="sideNav" aria-label="Library"></nav><div class="side-footer"><span data-icon="disc"></span><span>Your media.<br>Your own space.</span></div></aside><main id="main"><header id="header"><div><div class="eyebrow">VLC GLASS</div><h1 id="pageTitle">Video</h1><p id="pageSubtitle">Your collection, beautifully clear.</p></div><div class="header-actions"><button class="icon-button glass" data-action="settings" aria-label="Settings" data-icon="settings"></button><button class="icon-button glass" data-action="import" aria-label="Open media" data-icon="plus"></button></div></header><section class="toolbar"><label class="search glass"><span data-icon="search"></span><input id="search" type="search" placeholder="Search your library" aria-label="Search your library"></label><button id="sortButton" class="icon-button glass" data-action="sort" aria-label="Sort" data-icon="sort"></button><button id="viewButton" class="icon-button glass" data-action="view" aria-label="Switch list and grid view" data-icon="grid"></button></section><div id="content"></div></main><nav id="bottomNav" class="glass" aria-label="Library"></nav><div id="miniPlayer" class="glass hidden"></div></div>
<section id="player" class="hidden" aria-label="Media player"><video id="browserVideo" playsinline></video><div id="audioStage" class="hidden"><div class="audio-title"><span class="eyebrow">NOW PLAYING</span><h2 id="audioTitle"></h2><p>Make room for the music.</p></div><div id="playerDeck" class="anatomy-stage"></div><div class="audio-signal"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div><div id="speedBoost" class="glass hidden" role="status">▶▶ 2× speed</div><div id="skipLeft" class="skip-feedback" aria-hidden="true"><strong></strong></div><div id="skipRight" class="skip-feedback right" aria-hidden="true"><strong></strong></div><div id="playerHUD"><header class="player-top"><div class="control-group"><button class="icon-button" data-action="closePlayer" aria-label="Back to library" data-icon="back"></button><div class="playing-title" data-action="videoInfo" role="button" tabindex="0" aria-label="Media details"><strong id="playerTitle">Media</strong><span id="playerMeta">VLC playback</span></div></div><div class="glass control-group tools"><button class="icon-button" data-action="share" aria-label="Share" data-icon="share"></button><button class="icon-button" data-action="cast" aria-label="Cast to a receiver" data-icon="cast"></button><button class="icon-button quality-button" data-action="quality" aria-label="Video quality"><span id="qualityBadge">HQ</span></button><button class="icon-button" data-action="playerOptions" aria-label="Player settings" data-icon="settings"></button></div></header><footer class="player-bottom"><div class="player-tool-row"><div class="glass control-group"><button id="shuffleButton" class="icon-button" data-action="shuffle" aria-label="Shuffle" data-icon="shuffle"></button><button id="repeatButton" class="icon-button" data-action="repeat" aria-label="Repeat" data-icon="repeat"></button><button id="bookmarkButton" class="icon-button" data-action="bookmark" aria-label="Bookmark current position" data-icon="bookmark"></button></div><div class="glass control-group"><button class="icon-button" data-action="speed" aria-label="Playback speed"><span id="speedReadout">1×</span></button><button id="captionButton" class="icon-button" data-action="captions" aria-label="Turn captions on" aria-pressed="false" data-icon="subtitles"></button><button class="icon-button" data-action="queue" aria-label="Play queue" data-icon="queue"></button></div><button class="icon-button glass fullscreen-button" data-action="fullscreen" aria-label="Fullscreen" data-icon="fullscreen"></button><button id="lockButton" class="icon-button glass" data-action="lock" aria-label="Lock controls" data-icon="lock"></button></div><div class="seek-wrap"><div id="seekPreview" class="glass hidden"><img id="seekPreviewImage" alt="Preview frame" hidden><strong id="seekPreviewTime">0:00</strong><span id="seekPreviewChapter"></span><small id="seekPreviewHint">Drag to seek</small></div><div class="seek-pill"><span id="timeReadout">0:00</span><div class="seek-track"><div id="chapterMarkers" aria-hidden="true"></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position"></div><span id="durationReadout">0:00</span></div></div><button id="chapterReadout" class="chapter-readout text-button hidden" data-action="chapters" aria-label="Video chapters"></button><div class="volume-row"><button id="muteButton" class="icon-button" data-action="mute" aria-label="Mute" data-icon="volume"></button><input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume"><span id="volumeReadout">80%</span><button class="text-button" data-action="pip">Mini player</button><button class="text-button" data-action="rotate">Rotate</button></div><div class="transport glass" aria-label="Playback controls"><button class="icon-button" data-action="previous" aria-label="Previous media" data-icon="previous"></button><button class="skip" data-action="rewind" aria-label="Rewind 10 seconds" data-icon="rewind"></button><button id="playButton" class="play-button" data-action="toggle" aria-label="Play" data-icon="play"></button><button class="skip" data-action="forward" aria-label="Forward 10 seconds" data-icon="forward"></button><button class="icon-button" data-action="next" aria-label="Next media" data-icon="next"></button></div></footer></div><button id="unlockButton" class="icon-button glass hidden" data-action="lock" aria-label="Unlock controls" data-icon="lock"></button><div id="playerNotice" class="hidden" role="status"></div><div id="buffering" class="hidden" role="status"><span class="spinner"></span><span>Opening media…</span></div></section>
<div id="overlay" class="hidden"><div class="scrim" data-action="closeDialog"></div><section id="dialog" class="glass" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><header class="dialog-header"><div><p class="eyebrow" id="dialogEyebrow">VLC GLASS</p><h2 id="dialogTitle">Settings</h2></div><button class="icon-button" data-action="closeDialog" aria-label="Close dialog" data-icon="close"></button></header><div id="dialogBody"></div></section></div>
<div id="toast" role="status" class="glass hidden"></div><input id="browserFiles" type="file" accept="video/*,audio/*,.mkv,.avi,.flac,.opus,.ts" multiple hidden><input id="browserFolder" type="file" webkitdirectory multiple hidden><input id="browserSubtitles" type="file" accept=".vtt,.srt" hidden>
<script src="compat.js"></script><script src="glass.js"></script><script src="deck.js"></script><script src="host.js"></script><script src="app.js"></script><script src="player.js"></script><script src="intelligence.js"></script></body></html>
