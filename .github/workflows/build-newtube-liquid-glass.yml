name: Build NewTube Dual Liquid Glass APK

on:
  push:
    branches: [ "newtube-liquid-glass" ]
    paths:
      - "newtube-liquid-glass/**"
      - ".github/workflows/build-newtube-liquid-glass.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          path: integration

      - name: Checkout NewTube v1.15.0 with submodules
        uses: actions/checkout@v4
        with:
          repository: aleixrodriala/newtube
          ref: v1.15.0
          submodules: recursive
          path: newtube

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: newtube/**/*.gradle*

      - name: Apply and verify frontend
        run: |
          python integration/newtube-liquid-glass/apply_liquid_glass.py newtube
          python integration/newtube-liquid-glass/verify_liquid_glass.py newtube

      - name: Run navigation and layout regression tests
        working-directory: newtube
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :smarttubetv:testStmobileDebugUnitTest --tests com.newtube.mobile.ui.glass.GlassNavigationRegressionTest

      - name: Build APKs and device test APK
        working-directory: newtube
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PemulatorAbi :smarttubetv:assembleStmobileDebug :smarttubetv:assembleStmobileDebugAndroidTest
          ./gradlew --no-daemon :smarttubetv:assembleStmobileRelease

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify real Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          script: bash integration/newtube-liquid-glass/verify_device_ui.sh

      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NewTube-Glass-UI-Evidence
          path: |
            ui-evidence/
            device-test-result.txt
            newtube/smarttubetv/build/test-results/testStmobileDebugUnitTest/
          if-no-files-found: warn

      - name: Collect APKs
        run: |
          mkdir -p out
          find newtube/smarttubetv/build/outputs/apk/stmobile -type f -name "*.apk" -print -exec cp {} out/ \;
          ls -lah out
          test -n "$(find out -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewTube-v1.15.0-Dual-Liquid-Glass-APK
          path: |
            out/*universal*release*.apk
            out/*arm64*release*.apk
          if-no-files-found: error
          retention-days: 30
