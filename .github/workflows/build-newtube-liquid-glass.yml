name: Build NewTube Dual Liquid Glass APK

on:
  push:
    branches: [ "newtube-liquid-glass" ]
    paths:
      - "newtube-liquid-glass/**"
      - ".github/workflows/build-newtube-liquid-glass.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          path: integration

      - name: Checkout NewTube v1.15.0 with submodules
        uses: actions/checkout@v4
        with:
          repository: aleixrodriala/newtube
          ref: v1.15.0
          submodules: recursive
          path: newtube

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: newtube/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"

      - name: Apply and verify frontend
        run: |
          python integration/newtube-liquid-glass/apply_liquid_glass.py newtube
          python integration/newtube-liquid-glass/verify_liquid_glass.py newtube

      - name: Build mobile debug APK
        working-directory: newtube
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :smarttubetv:assembleStmobileDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          find newtube/smarttubetv/build -type f -name "*.apk" -print -exec cp {} out/ \;
          ls -lah out
          test -n "$(find out -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewTube-v1.15.0-Dual-Liquid-Glass-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
