name: Android playback and form-factor checks
on:
  push:
    branches: [vlc-glass-0.3.0]
    paths: ['android-qa/**', 'publish-0.3.1/manifest.json', '.github/workflows/test-vlc-glass-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            profile: pixel_2
            label: Android-9-phone
          - api: 35
            profile: pixel_tablet
            label: Android-15-tablet
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify application APKs
        run: python3 publish-0.3.1/reassemble.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check native playback and responsive prompt
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash android-qa/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QA-${{ matrix.label }}
          path: |
            android-qa/*.json
            android-qa/*.log
            android-qa/*.txt
            android-qa/*.png
          retention-days: 14
