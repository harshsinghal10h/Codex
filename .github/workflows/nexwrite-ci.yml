name: NexWrite bootstrap

on:
  pull_request:
    paths: ["NexWrite/**", ".github/workflows/nexwrite-ci.yml"]
  push:
    paths: ["NexWrite/**", ".github/workflows/nexwrite-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexwrite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: NexWrite

jobs:
  native:
    name: Native core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.14.0
          package_json_file: NexWrite/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: NexWrite/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm check
      - run: pnpm --filter @nexwrite/protocol check
      - run: pnpm test
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: pnpm build
      - name: Ensure generation and checks do not modify tracked inputs
        run: git diff --exit-code -- .

  wasm:
    name: WASM and own-artifact audit (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - run: cargo build -p nw-cli --locked
      - run: cargo build -p nw-wasm --release --target wasm32-unknown-unknown --locked
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.129
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/nw_wasm.wasm --target nodejs --out-dir target/wasm-node
      - run: node tools/wasm-smoke.mjs
      - name: Audit only NexWrite generated artifacts with REA
        run: |
          mkdir -p ci/reports
          npm install --prefix target/rea-cli --ignore-scripts --no-audit --no-fund rea-agents@6.4.0
          target/rea-cli/node_modules/.bin/rea analyze-javascript-application "${PWD}/target/wasm-node" --artifact-format directory --format json --full-output > ci/reports/own-wasm-rea.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nexwrite-own-wasm-rea
          path: NexWrite/ci/reports/own-wasm-rea.json
          if-no-files-found: error

  supply-chain:
    name: Licenses, advisories, secrets and service configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.14.0
          package_json_file: NexWrite/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: NexWrite/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.99.1
      - run: pnpm install --frozen-lockfile
      - run: node tools/license-check.mjs
      - run: pnpm audit --audit-level high
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny --locked check
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --show-error --silent --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          printf '%s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p target/tools
          tar -xzf /tmp/gitleaks.tar.gz -C target/tools gitleaks
          echo "${PWD}/target/tools" >> "$GITHUB_PATH"
      - run: node tools/secret-check.mjs
      - name: Scan repository history for secrets
        run: gitleaks git .. --config .gitleaks.toml --redact --no-banner
      - run: node tools/compose-check.mjs
