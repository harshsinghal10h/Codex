# SPDX-License-Identifier: LicenseRef-NexWrite-Proprietary
name: NexWrite Android checks

on:
  pull_request:
    paths: ["NexWrite/**", ".github/workflows/nexwrite-android.yml", ".github/workflows/nexwrite-ci.yml"]
  push:
    paths: ["NexWrite/**", ".github/workflows/nexwrite-android.yml", ".github/workflows/nexwrite-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexwrite-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: NexWrite

jobs:
  android:
    name: Native APK, JVM checks and API 36 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17.0.20.1+1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rust-docs
      - name: Install official Android SDK packages
        run: |
          mkdir -p ci/reports
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          bootstrap_sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          python3 -c 'print("y\n" * 200)' > "$RUNNER_TEMP/nexwrite-sdk-license-input"
          "$bootstrap_sdkmanager" --licenses < "$RUNNER_TEMP/nexwrite-sdk-license-input" > ci/reports/android-sdk-licenses.log
          "$bootstrap_sdkmanager" --install 'cmdline-tools;19.0'
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/19.0/bin/sdkmanager"
          node tools/ci-report.mjs --label "Android SDK installation" --log ci/reports/android-sdk-install.log -- "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.1.0' 'ndk;27.2.12479018' 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64'
          rm "$RUNNER_TEMP/nexwrite-sdk-license-input"
          "$sdkmanager" --list_installed > ci/reports/android-sdk-packages.txt
          "$ANDROID_SDK_ROOT/emulator/emulator" -version > ci/reports/android-emulator-version.txt
          java -version 2> ci/reports/java-version.txt
      - name: Check committed protocol generation
        run: |
          node tools/codegen/generate.mjs --check
          node tools/api-codegen.mjs --check
      - name: Test the real native bridge on the host JVM
        run: node tools/ci-report.mjs --label "Host JNI transport tests" --log ci/reports/android-host-jni.log -- node core/bridge/tools/jvm-smoke.mjs
      - name: Build the same Rust core for all packaged ABIs
        run: node tools/ci-report.mjs --label "Android native core build" --log ci/reports/android-native-build.log -- bash tools/build-android-core.sh
      - name: Generate notices from installed locked dependencies
        run: |
          node tools/ci-report.mjs --label "Locked Cargo notice inputs" --log ci/reports/android-cargo-fetch.log -- cargo fetch --locked
          node tools/ci-report.mjs --label "Android runtime inventory" --log ci/reports/android-runtime-inventory.log -- bash apps/android/gradlew --no-daemon :app:runtimeComponentInventory
          node tools/ci-report.mjs --label "Android notice assets" --log ci/reports/android-notices.log -- node tools/android-notices.mjs
          test -s target/android-assets/notices/THIRD_PARTY_NOTICES.txt
          test -s target/android-assets/notices/inventory.json
      - name: Build native APKs and run JVM tests and lint
        run: node tools/ci-report.mjs --label "Android build, JVM tests and lint" --log ci/reports/android-build.log -- bash apps/android/gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Start an actual Android emulator with KVM
        run: |
          test -c /dev/kvm || { echo '::error title=Android emulator::KVM is unavailable; instrumented tests require actual hardware virtualization.'; exit 1; }
          sudo chmod a+rw /dev/kvm
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/cmdline-tools/19.0/bin:$PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          printf 'no\n' | avdmanager create avd --force --name nexwrite-api36 --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          emulator -avd nexwrite-api36 -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -no-metrics -wipe-data > ci/reports/android-emulator.log 2>&1 &
          timeout 240s adb wait-for-device || { echo '::error title=Android emulator::No emulator device became available within 240 seconds.'; exit 1; }
          booted=false
          for attempt in {1..120}; do
            boot_state=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [[ "$boot_state" == 1 ]]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" == true || { echo '::error title=Android emulator::The emulator did not complete boot within the bounded wait.'; exit 1; }
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.fingerprint > ci/reports/android-emulator-fingerprint.txt
          adb shell getprop ro.build.version.sdk > ci/reports/android-emulator-api.txt
      - name: Install and execute instrumented app and bridge tests
        run: node tools/ci-report.mjs --label "Android instrumented tests" --log ci/reports/android-instrumentation.log -- bash apps/android/gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Stop the emulator
        if: always()
        run: |
          if [[ -x "$ANDROID_HOME/platform-tools/adb" ]]; then
            "$ANDROID_HOME/platform-tools/adb" emu kill || true
          fi
      - name: Ensure native builds do not modify tracked inputs
        run: git diff --exit-code -- .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nexwrite-android-results
          path: |
            NexWrite/ci/reports/
            NexWrite/apps/android/app/build/reports/
            NexWrite/apps/android/app/build/test-results/
            NexWrite/apps/android/app/build/outputs/apk/
            NexWrite/apps/android/app/build/outputs/androidTest-results/
            NexWrite/target/android-assets/notices/
          if-no-files-found: warn
