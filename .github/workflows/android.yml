name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python3 tools/test-core.py
      - name: Build CI-signed test artifact
        env:
          LIVELY_KEY_PASSWORD: ci-build-only
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -alias lively -storepass:env LIVELY_KEY_PASSWORD -keypass:env LIVELY_KEY_PASSWORD -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Lively CI"
          python3 tools/build.py --keystore "$RUNNER_TEMP/ci.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: lively-ci-apk
          path: build/Lively-Android-0.2.0.apk
