name: Android wallpaper flows
on:
  workflow_dispatch:
  push:
    branches: [lively-android]
    paths: ['app/**', 'tests/**', 'tools/**', '.github/workflows/wallpaper-qa.yml']
permissions:
  contents: read
jobs:
  wallpaper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build app and isolated test APK
        env:
          LIVELY_KEY_PASSWORD: ci-wallpaper-tests-only
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/qa.jks" -alias lively -storepass:env LIVELY_KEY_PASSWORD -keypass:env LIVELY_KEY_PASSWORD -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Lively QA"
          python3 tools/build.py --keystore "$RUNNER_TEMP/qa.jks"
          python3 tools/build-tests.py --sdk "$ANDROID_HOME" --keystore "$RUNNER_TEMP/qa.jks"
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: false
          script: |
            adb install -r build/Lively-Android-0.2.0.apk
            adb install -r build/native-tests/native-tests.apk
            adb shell input keyevent 82
            adb shell am instrument -w io.lively.android.tests/io.lively.android.WallpaperFlowTests | tee build/wallpaper-test-result.txt
            adb logcat -d > build/wallpaper-logcat.txt
            adb pull /sdcard/Android/data/io.lively.android/files/wallpaper-flow build/wallpaper-screenshots || true
            grep -q 'PASS: .* wallpaper flow assertions' build/wallpaper-test-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallpaper-qa-api-${{ matrix.api }}
          path: |
            build/wallpaper-test-result.txt
            build/wallpaper-logcat.txt
            build/wallpaper-screenshots
