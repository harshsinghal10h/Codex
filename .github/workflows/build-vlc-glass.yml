name: Build VLC Glass 0.3.1
on:
  push:
    branches: [vlc-glass-0.3.0]
    paths: ['VLC-Glass/**', '.github/workflows/build-vlc-glass.yml']
  workflow_dispatch:
concurrency:
  group: vlc-glass-desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  supersede:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Stop superseded development runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=vlc-glass-0.3.0&status=in_progress&per_page=100" --jq '.workflow_runs[] | select(.name == "Build VLC Glass 0.3.1" and .id < (env.GITHUB_RUN_ID | tonumber)) | .id' > old-runs.txt
          while read -r id; do gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" || true; done < old-runs.txt
  desktop:
    needs: [supersede]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
          - os: macos-15
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
          - os: ubuntu-22.04
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: VLC-Glass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: VLC-Glass/desktop/requirements.txt
      - name: Install desktop requirements
        run: python -m pip install -r desktop/requirements.txt
      - name: Prepare pinned model and search sources
        run: python tools/prepare_dependencies.py --desktop
      - name: Install Linux media libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vlc libvlc-dev libegl1 libxcb-cursor0 libxkbcommon-x11-0 xvfb
      - name: Install official macOS VLC
        if: runner.os == 'macOS'
        run: brew install --cask vlc
      - name: Test timeline policy
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Create safe playback fixture
        run: python tools/make_smoke_video.py
      - name: Stage native runtime
        run: python tools/build_desktop.py --prepare-only
      - name: Test source UI on Windows
        if: runner.os == 'Windows'
        run: python desktop/main.py --ui-smoke-report ui-source-smoke.json --smoke-video build/safe-smoke.mp4
      - name: Test source UI on Mac
        env:
          DYLD_LIBRARY_PATH: /Applications/VLC.app/Contents/MacOS/lib
        if: runner.os == 'macOS'
        run: |
          python -c "import ctypes;ctypes.CDLL('/Applications/VLC.app/Contents/MacOS/lib/libvlc.dylib')"
          python desktop/main.py --ui-smoke-report ui-source-smoke.json --smoke-video build/safe-smoke.mp4
      - name: Test source UI on Linux
        if: runner.os == 'Linux'
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
          QT_OPENGL: software
        run: xvfb-run -a python desktop/main.py --ui-smoke-report ui-source-smoke.json --smoke-video build/safe-smoke.mp4
      - name: Package desktop app
        run: python tools/build_desktop.py
      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/VLC-Glass-0.3.1.exe" -ArgumentList "--smoke-report", "desktop-smoke.json" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path desktop-smoke.json)) { throw 'Packaged runtime smoke test failed' }
          Get-Content desktop-smoke.json
          $process = Start-Process -FilePath "dist/VLC-Glass-0.3.1.exe" -ArgumentList "--ui-smoke-report", "ui-smoke.json", "--smoke-video", "build/safe-smoke.mp4" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path ui-smoke.json)) { throw 'Packaged UI playback test failed' }
          Get-Content ui-smoke.json
      - name: Smoke test Unix package
        if: runner.os != 'Windows'
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
          QT_OPENGL: software
        shell: bash
        run: |
          if [ -d dist/VLC-Glass-0.3.1.app ]; then
            dist/VLC-Glass-0.3.1.app/Contents/MacOS/VLC-Glass-0.3.1 --smoke-report desktop-smoke.json
            dist/VLC-Glass-0.3.1.app/Contents/MacOS/VLC-Glass-0.3.1 --ui-smoke-report ui-smoke.json --smoke-video build/safe-smoke.mp4
            ditto -c -k --sequesterRsrc --keepParent dist/VLC-Glass-0.3.1.app dist/VLC-Glass-0.3.1-${{ matrix.label }}.zip
          else
            dist/VLC-Glass-0.3.1/VLC-Glass-0.3.1 --smoke-report desktop-smoke.json
            xvfb-run -a dist/VLC-Glass-0.3.1/VLC-Glass-0.3.1 --ui-smoke-report ui-smoke.json --smoke-video build/safe-smoke.mp4
            tar -C dist -czf dist/VLC-Glass-0.3.1-${{ matrix.label }}.tar.gz VLC-Glass-0.3.1
          fi
          cat desktop-smoke.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: QA-failure-${{ matrix.label }}
          path: |
            VLC-Glass/*smoke.json
            VLC-Glass/ui-*.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VLC-Glass-${{ matrix.label }}
          path: |
            VLC-Glass/dist/*.exe
            VLC-Glass/dist/*.zip
            VLC-Glass/dist/*.tar.gz
            VLC-Glass/desktop-smoke.json
            VLC-Glass/ui-smoke.json
            VLC-Glass/ui-smoke.png
            VLC-Glass/ui-phone.png
          compression-level: 0
          retention-days: 14
  release:
    needs: [desktop]
    if: ${{ always() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VLC-Glass-*
          path: release-assets
      - name: Publish available development builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('release-assets')
          paths=[p for p in root.rglob('*') if p.suffix in ('.exe','.zip','.gz')]
          if not paths:raise SystemExit('No verified desktop packages were produced')
          for p in root.glob('VLC-Glass-*/*smoke.json'):
              p.rename(p.with_name(p.parent.name+'-'+p.name))
          (root/'SHA256SUMS-desktop.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in paths))
          PY
          gh release view vlc-glass-v0.3.1 || gh release create vlc-glass-v0.3.1 --target "$GITHUB_SHA" --prerelease --title 'VLC Glass 0.3.1 development builds' --notes-file VLC-Glass/RELEASE.md
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/vlc-glass-v0.3.1" -f sha="$GITHUB_SHA" -F force=true
          find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.gz' -o -name 'SHA256SUMS-desktop.txt' -o -name '*smoke.json' \) -print0 | xargs -0 -r gh release upload vlc-glass-v0.3.1 --clobber
